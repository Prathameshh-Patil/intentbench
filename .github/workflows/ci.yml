name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Keep the downloaded dataset between runs so CI doesn't re-download it every time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/intentbench/data.py') }}

      - name: Install
        # CPU-only PyTorch: CI never trains, and the default Linux build bundles GBs of GPU libraries.
        run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: |
          ruff format --check .
          ruff check .

      - name: Test
        run: pytest -q
